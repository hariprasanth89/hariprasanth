  - title: 💼 Work Experience
    layout: list
    content:
      - layout: left
        title: 💳 PayPal
        link: https://www.paypal.com
        link_text: paypal.com · venmo.com
        sub_title: 🚀 Full Stack Engineer
        caption: 📅 October 2024 – Present
        quote: >
          🌟 Powering the future of digital payments — building robust, secure, and scalable full-stack solutions at one of the world's leading fintech companies.
        description: |
          🤝 **Collaboration** — Partnered with designers, QA, and business stakeholders via Agile/Scrum to ship high-impact payment features on schedule.

          ☁️ **Cloud Deployment** — Built and deployed Spring Boot microservices on AWS Beanstalk, integrating REST and SOAP APIs for scalable payment services.

          🔐 **Security &amp; Auth** — Implemented OAuth2 and SSO across ECM and payment platforms, securing millions of API transactions per day.

          🔁 **CI/CD Pipelines** — Automated builds and deployments using Jenkins and Harness with IAM roles and secure VPC configurations.

          ⚡ **Performance** — Boosted throughput via caching strategies, async data fetching, and microservice query optimization.

          🧑‍💻 **Code Quality** — Reviewed, tested, and shipped high-quality Java and Node.js code with thorough integration coverage.

          <div class="tech-stack-row"><strong>📌 Stack:</strong> <code>Java</code> <code>Spring Boot</code> <code>Node.js</code> <code>AWS</code> <code>OAuth2</code> <code>Jenkins</code> <code>Harness</code> <code>REST APIs</code></div>

      - layout: left
        title: 🌐 Cisco
        link: https://www.cisco.com
        link_text: cisco.com
        sub_title: 🔧 Full Stack Engineer
        caption: 📅 September 2023 – September 2024
        quote: >
          🌐 Driving enterprise-scale backend modernization for Cisco's Estimates, Quoting, Ordering, and Subscriptions/Renewals platform.
        description: |
          🏗️ **Backend Architecture** — Built multi-layer services (Entity → DAO → Service → Controller) using Spring Boot and Hibernate for core business modules.

          🗄️ **Advanced ORM** — Leveraged Hibernate features including lazy loading, dirty checking, optimistic locking, and transaction management.

          🧪 **TDD &amp; Quality** — Practiced Test-Driven Development with JUnit, pair programming, and daily Scrum ceremonies.

          🌐 **RESTful APIs** — Designed and validated RESTful endpoints via Postman for client and third-party system integrations.

          ⚛️ **React Frontend** — Built Class Components with effective state management to support complex quoting workflows.

          📋 **Agile Delivery** — Tracked sprints in JIRA and maintained clean Git history with structured branching and PR workflows.

          <div class="tech-stack-row"><strong>📌 Stack:</strong> <code>Java</code> <code>Spring Boot</code> <code>Hibernate</code> <code>React</code> <code>JUnit</code> <code>JIRA</code> <code>Git</code> <code>Postman</code></div>

      - layout: left
        title: 💰 Intuit
        link: https://www.intuit.com
        link_text: intuit.com
        sub_title: 🖥️ Full Stack Engineer
        caption: 📅 February 2022 – August 2023
        quote: >
          💡 Designing and building full-stack financial applications that empower small businesses and individuals worldwide.
        description: |
          🏗️ **Full-Stack Architecture** — Architected complete backend layers (Entity/Model, DAO/Repository, Service, Controller) with Spring Boot and Hibernate ORM.

          🗄️ **Database Design** — Created optimized schemas and integrated them with Hibernate for clean object-relational mapping.

          📦 **Batch Processing** — Implemented Spring Batch pipelines to extract and load data from CSV/Excel files at scale.

          🌐 **API &amp; UI** — Designed REST APIs validated via Postman; built responsive React frontends with clean state management.

          ✅ **Testing** — Wrote comprehensive JUnit test suites achieving high code coverage and reliability.

          🔄 **Agile** — Actively contributed to sprint planning, backlog grooming, stand-ups, and retrospectives.

          <div class="tech-stack-row"><strong>📌 Stack:</strong> <code>Java</code> <code>Spring Boot</code> <code>Hibernate</code> <code>Spring Batch</code> <code>React</code> <code>JUnit</code> <code>JIRA</code> <code>Git</code></div>

      - layout: left
        title: 🏦 Trie Coders Pvt Ltd.
        link: http://www.triecoders.com/
        link_text: triecoders.com
        sub_title: 👨‍💻 Sr. Software Engineer
        caption: 📅 December 2017 – November 2021
        quote: >
          🏦 Architecting reliable banking microservices — enabling customers to manage accounts, transactions, and finances seamlessly.
        description: |
          💳 **Banking Platform** — Developed a core banking app for managing accounts, transactions, and user information securely.

          🔧 **Microservices** — Optimized services using Lombok, built REST endpoints, and handled JSON flows between UI and API layers.

          ☁️ **Cloud** — Deployed Java services on AWS Beanstalk with auto-scaling for high-availability production workloads.

          🤝 **Team** — Participated in agile sprints, daily scrums, and cross-functional code reviews.

